<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #131a2b;
    --panel-2: #1b2540;
    --grid: #161d30;
    --accent: #4ade80;
    --accent-dim: #22c55e;
    --food: #f472b6;
    --text: #e6ecff;
    --muted: #7c88a8;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, #16233f 0%, transparent 60%),
      radial-gradient(1000px 500px at 100% 110%, #1a1330 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand .dot {
    width: 14px; height: 14px; border-radius: 4px;
    background: var(--accent);
    box-shadow: 0 0 16px var(--accent);
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .scores {
    display: flex;
    gap: 10px;
  }

  .score {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 8px 14px;
    text-align: right;
    min-width: 78px;
  }

  .score .label {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  .score .value {
    font-size: 1.3rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }

  .board-wrap {
    position: relative;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    background: var(--grid);
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 14px;
    border-radius: 12px;
    background: rgba(11,15,26,0.82);
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    transition: opacity 0.25s ease;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .overlay h2 {
    font-size: 1.6rem;
    letter-spacing: -0.02em;
  }

  .overlay p {
    color: var(--muted);
    font-size: 0.92rem;
    max-width: 30ch;
    line-height: 1.5;
  }

  .btn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    color: #06210f;
    background: linear-gradient(180deg, var(--accent), var(--accent-dim));
    border: none;
    border-radius: 12px;
    padding: 12px 26px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.2s ease;
    box-shadow: 0 10px 24px -8px var(--accent-dim);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -10px var(--accent-dim); }
  .btn:active { transform: translateY(0); }

  .hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    font-size: 0.82rem;
    flex-wrap: wrap;
  }

  kbd {
    font-family: inherit;
    font-size: 0.72rem;
    background: var(--panel-2);
    border: 1px solid rgba(255,255,255,0.08);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 2px 7px;
    color: var(--text);
  }

  /* On-screen dpad for touch */
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    max-width: 220px;
    margin: 4px auto 0;
  }
  .dpad button {
    aspect-ratio: 1;
    border: 1px solid rgba(255,255,255,0.08);
    background: var(--panel);
    color: var(--text);
    border-radius: 14px;
    font-size: 1.4rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s ease, transform 0.08s ease;
  }
  .dpad button:active { background: var(--panel-2); transform: scale(0.94); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }

  @media (hover: none) and (pointer: coarse) {
    .dpad { display: grid; }
  }

  @media (max-width: 380px) {
    h1 { font-size: 1.25rem; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <span class="dot"></span>
        <h1>Snake</h1>
      </div>
      <div class="scores">
        <div class="score">
          <div class="label">Score</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score">
          <div class="label">Best</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">Ready to slither?</h2>
        <p id="ov-msg">Eat the pink dots to grow. Don't hit the walls or yourself.</p>
        <button class="btn" id="startBtn">Play</button>
      </div>
    </div>

    <div class="hint">
      <span>Move with</span>
      <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>
      <span>or</span>
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
      <span>·</span>
      <kbd>Space</kbd><span>pause</span>
    </div>

    <div class="dpad" aria-hidden="true">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="right" data-dir="right">▶</button>
      <button class="down" data-dir="down">▼</button>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovMsg = document.getElementById('ov-msg');
  const startBtn = document.getElementById('startBtn');

  const CELLS = 20;               // grid is 20 x 20
  const SIZE = canvas.width;      // logical pixel size
  const CELL = SIZE / CELLS;

  // Game state
  let snake, dir, nextDir, food, score, best = 0;
  let running = false, paused = false, gameOver = false;
  let lastTick = 0, tickInterval = 130, acc = 0;
  let growPulse = 0;              // brief pop when eating

  function reset() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    tickInterval = 130;
    gameOver = false;
    paused = false;
    placeFood();
    updateScore();
  }

  function placeFood() {
    let p;
    do {
      p = { x: (Math.random() * CELLS) | 0, y: (Math.random() * CELLS) | 0 };
    } while (snake.some(s => s.x === p.x && s.y === p.y));
    food = p;
  }

  function updateScore() {
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; }
  }

  function setDir(nx, ny) {
    // prevent reversing directly into the neck
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = { x: nx, y: ny };
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS) {
      return end();
    }
    // self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return end();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      growPulse = 1;
      updateScore();
      placeFood();
      // speed up gently, floor at 70ms
      tickInterval = Math.max(70, tickInterval - 3);
    } else {
      snake.pop();
    }
  }

  function end() {
    gameOver = true;
    running = false;
    showOverlay('Game over', `You scored ${score}. ${score >= best && score > 0 ? "That's a new best!" : 'Give it another go.'}`, 'Play again');
  }

  // ---- Rendering ----
  function drawGrid() {
    ctx.fillStyle = '#161d30';
    ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for (let i = 1; i < CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, SIZE); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL); ctx.lineTo(SIZE, i * CELL); ctx.stroke();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function drawFood() {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 260);
    const pad = 3 + pulse * 1.5;
    ctx.save();
    ctx.shadowColor = '#f472b6';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#f472b6';
    roundRect(food.x * CELL + pad, food.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 6);
    ctx.restore();
  }

  function drawSnake() {
    const pop = growPulse;
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(1, snake.length - 1);
      // head bright, tail dimmer
      const g = Math.round(74 + (1 - t) * 60);
      ctx.fillStyle = i === 0 ? '#86efac' : `rgb(${34 + (1-t)*30}, ${197 - t*90}, ${94 - t*30})`;
      const inset = 2 + (i === 0 ? pop * 1.2 : 0);
      roundRect(s.x * CELL + inset, s.y * CELL + inset, CELL - inset * 2, CELL - inset * 2, i === 0 ? 7 : 5);
    }
    // eyes on the head
    const h = snake[0];
    ctx.fillStyle = '#06210f';
    const cx = h.x * CELL, cy = h.y * CELL;
    const e = 2.6;
    let ex1, ey1, ex2, ey2;
    if (dir.x === 1) { ex1 = ex2 = cx + CELL - 6; ey1 = cy + 6; ey2 = cy + CELL - 6; }
    else if (dir.x === -1) { ex1 = ex2 = cx + 6; ey1 = cy + 6; ey2 = cy + CELL - 6; }
    else if (dir.y === 1) { ey1 = ey2 = cy + CELL - 6; ex1 = cx + 6; ex2 = cx + CELL - 6; }
    else { ey1 = ey2 = cy + 6; ex1 = cx + 6; ex2 = cx + CELL - 6; }
    ctx.beginPath(); ctx.arc(ex1, ey1, e, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2, ey2, e, 0, 7); ctx.fill();
  }

  function render() {
    drawGrid();
    drawFood();
    drawSnake();
  }

  function loop(ts) {
    if (!running) return;
    if (!lastTick) lastTick = ts;
    const delta = ts - lastTick;
    lastTick = ts;

    if (!paused) {
      acc += delta;
      while (acc >= tickInterval) {
        step();
        acc -= tickInterval;
        if (gameOver) break;
      }
      growPulse *= 0.85;
      render();
    }
    requestAnimationFrame(loop);
  }

  // ---- Overlay / flow ----
  function showOverlay(title, msg, btn) {
    ovTitle.textContent = title;
    ovMsg.textContent = msg;
    startBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  function startGame() {
    reset();
    hideOverlay();
    running = true;
    paused = false;
    lastTick = 0; acc = 0;
    requestAnimationFrame(loop);
  }

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    if (paused) {
      showOverlay('Paused', 'Take a breath. Your snake will wait.', 'Resume');
    } else {
      hideOverlay();
      lastTick = 0;
    }
  }

  startBtn.addEventListener('click', () => {
    if (paused && running) { togglePause(); }
    else { startGame(); }
  });

  // ---- Input ----
  const keyMap = {
    ArrowUp: [0, -1], KeyW: [0, -1],
    ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0],
  };
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (!running && !paused) startGame(); else togglePause();
      return;
    }
    const m = keyMap[e.code];
    if (m) { e.preventDefault(); setDir(m[0], m[1]); }
  });

  // dpad
  document.querySelectorAll('.dpad button').forEach(b => {
    b.addEventListener('click', () => {
      const d = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] }[b.dataset.dir];
      setDir(d[0], d[1]);
    });
  });

  // swipe on canvas
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (!touchStart) return;
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
  }, { passive: true });

  // initial paint behind overlay
  reset();
  render();
})();
</script>
</body>
</html>
